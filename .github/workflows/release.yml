name: Verify GitLab release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check GitLab release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
          test -n "$tag"
          assets="$(gh release view "$tag" --repo splunk/splunkctl --json assets --jq '.assets[].name')"
          for asset in \
            "splunkctl_${tag#v}_linux_amd64.tar.gz" \
            "splunkctl_${tag#v}_linux_arm64.tar.gz" \
            "splunkctl_${tag#v}_darwin_amd64.tar.gz" \
            "splunkctl_${tag#v}_darwin_arm64.tar.gz" \
            "splunkctl_${tag#v}_windows_amd64.zip"; do
            printf '%s\n' "$assets" | grep -Fx "$asset" >/dev/null
          done
